<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date · Ella & Aditya</title>
  <!-- Warm up the connection so the Postable page loads faster after the tap -->
  <link rel="preconnect" href="https://www.postable.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gotu&family=Noto+Serif+Devanagari:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #A49A87;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #1c1819;
      overflow-x: hidden;
    }

    /* Photo booth flash that fades out on load */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 10;
      animation: flash 1s ease-out forwards;
    }

    @keyframes flash {
      0%   { opacity: 0.95; }
      15%  { opacity: 0.95; }
      100% { opacity: 0; }
    }

    /* Each section fills the screen on its own */
    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .scroll-cue {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: #1c1819;
      transition: opacity 0.4s;
    }

    /* Cue pinned to the bottom of the contact panel instead of the viewport */
    .scroll-cue.inline {
      position: absolute;
      bottom: 1.6rem;
    }

    .scroll-cue.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-cue svg {
      width: 22px;
      height: 22px;
      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(6px); }
    }

    .countdown, .contact, .follow {
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    .countdown.visible, .contact.visible, .follow.visible {
      opacity: 1;
      transform: none;
    }

    /* Contact and countdown sections share one font */
    #contact-screen, #countdown-screen {
      font-family: "Noto Serif Devanagari", serif;
      font-optical-sizing: auto;
      font-variation-settings: "wdth" 100;
    }

    .contact {
      width: 100%;
      max-width: 32rem;
    }

    /* Framed panel, as wide as the save the date card and at least as tall */
    .panel {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      min-height: var(--card-h, 30rem);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .panel.has-cue { padding-bottom: 5.5rem; }

    /* Thin double-line frame: two 1px lines with a 3px gap, outer line on the panel edge */
    .panel::before {
      content: "";
      position: absolute;
      inset: 4px;
      /* 4px less than the card's 16px so the outer line follows its corners */
      border-radius: 12px;
      border: 1px solid #1c1819;
      outline: 1px solid #1c1819;
      outline-offset: 3px;
      /* Darker, see-through take on the card's cream */
      background: rgba(214, 204, 186, 0.55);
      z-index: -1;
      pointer-events: none;
    }

    .follow {
      margin-bottom: 3rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    .follow .lead {
      margin: 0 0 1rem;
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .follow p { margin: 0; }

    .contact h2 {
      margin: 0;
      font-family: "Gotu", sans-serif;
      font-size: 2.2rem;
      font-weight: 400;
      line-height: 1.3;
    }

    /* Twirly arrow that draws itself toward the button */
    .swirl {
      display: block;
      width: 70px;
      height: 96px;
      margin: 0.8rem auto 0.4rem;
      overflow: visible;
    }

    .swirl path {
      fill: none;
      stroke: #1c1819;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .contact.visible .swirl .line { animation: draw 1.8s ease-in-out 0.5s forwards; }
    .contact.visible .swirl .head { animation: draw 0.4s ease-out 2.2s forwards; }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.5rem;
      padding: 0 2.5rem;
      background: #7A2D29;
      color: #f4efe6;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s, background 0.2s;
    }

    .contact-btn:hover { background: #8f3732; }
    .contact-btn:active { transform: scale(0.97); }

    .contact-btn:focus-visible {
      outline: 3px solid #1c1819;
      outline-offset: 3px;
    }

    .countdown .questions {
      margin: 0 0 2.5rem;
      font-family: "Gotu", sans-serif;
      font-size: 1.0rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    .countdown h2 {
      margin: 0 0 2rem;
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    .timer {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .unit {
      min-width: 6rem;
    }

    .unit .num {
      display: block;
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit .label {
      display: block;
      margin-top: 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .card {
      width: 100%;
      max-width: 1000px;
      background: #f4efe6;
      border-radius: 16px;
      padding: 2.2rem 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .top, .bottom, .names-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .top { margin-bottom: 1rem; }

    .strips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
    }

    .strip {
      position: relative;
      aspect-ratio: 3 / 5;
      background: #111;
      border: 6px solid #1c1819;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #333;
      opacity: 0;
      filter: blur(6px);
      animation: develop 1.2s ease-out forwards;
    }

    /* Strips 2 and 3 stay in color */
    .strip:nth-child(2) img,
    .strip:nth-child(3) img {
      filter: contrast(1.05) brightness(1);
    }

    /* Each strip develops one after another */
    .strip:nth-child(1) { animation-delay: 1.0s; }
    .strip:nth-child(2) { animation-delay: 1.6s; }
    .strip:nth-child(3) { animation-delay: 2.2s; }
    .strip:nth-child(4) { animation-delay: 2.8s; }

    @keyframes develop {
      0% {
        opacity: 0;
        filter: blur(6px) brightness(1.6);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        filter: blur(0) brightness(1);
      }
    }

    .strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.15) brightness(0.95);
    }

    .names-row {
      margin-top: 1rem;
    }

    .back {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .back a {
      color: #1c1819;
    }

    /* Wide screens: the contact and countdown panels merge into one framed panel, stacked */
    @media (min-width: 900px) {
      /* Full-height wrapper keeps the merged panel centered on screen */
      .duo-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .duo {
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3.5rem;
        width: 100%;
        max-width: 1000px;
        min-height: var(--card-h, 30rem);
        padding: 3rem 2rem;
      }

      /* Same double-line frame as the single panels, drawn once around both */
      .duo::before {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 12px;
        border: 1px solid #1c1819;
        outline: 1px solid #1c1819;
        outline-offset: 3px;
        background: rgba(214, 204, 186, 0.55);
        z-index: -1;
        pointer-events: none;
      }

      .duo > .screen {
        min-height: 0;
        padding: 0;
      }

      /* Inner panels lose their own frame and sizing */
      .duo .panel {
        min-height: 0;
        padding: 0;
      }

      .duo .panel::before { display: none; }

      .duo .follow { margin-bottom: 2.5rem; }

      .scroll-cue.inline { display: none; }
    }

    @media (max-width: 700px) {
      .strips { grid-template-columns: repeat(2, 1fr); }
      .card { padding: 1.5rem; }
      /* Leave room under the card for the fixed scroll cue */
      .screen:first-of-type { padding-bottom: 6rem; }
      .top, .names-row { font-size: 0.7rem; }
      .contact h2 { font-size: 1.7rem; }
      .follow .lead { font-size: 1.1rem; }
      .contact-btn { width: 100%; }
      .timer { gap: 0.5rem; }
      .unit { min-width: 4.5rem; }
      .unit .num { font-size: 2.5rem; }
    }

    /* Skip the effects for guests who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      .flash { display: none; }
      .scroll-cue svg { animation: none; }
      .countdown, .contact, .follow {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .swirl path {
        stroke-dashoffset: 0;
        animation: none !important;
      }
      .strip {
        opacity: 1;
        filter: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="flash" aria-hidden="true"></div>

  <section class="screen">
  <main class="card">
    <div class="top">
      <span>Save the Date</span>
      <span>[03.21.27]</span>
    </div>

    <div class="strips">
      <div class="strip"><img src="strip1.jpg" alt="Photo booth photo 1"></div>
      <div class="strip"><img src="strip2.jpg" alt="Photo booth photo 2"></div>
      <div class="strip"><img src="strip3.jpg" alt="Photo booth photo 3"></div>
      <div class="strip"><img src="strip4.jpg" alt="Photo booth photo 4"></div>
    </div>

    <div class="names-row">
      <span>Ella and Aditya</span>
      <span>[Portland, OR]</span>
    </div>
  </main>
  </section>

  <a class="scroll-cue" id="scroll-cue" href="#duo-screen" aria-label="Scroll down">
    <span>Scroll</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </a>

  <div class="duo-screen" id="duo-screen">
  <div class="duo" id="duo">
  <section class="screen" id="contact-screen">
   <div class="panel has-cue">
    <div class="follow" id="follow">
      <p class="lead">Formal invitation to follow</p>
      <p>Portland, OR</p>
      <p>03.21.27</p>
    </div>

    <div class="contact" id="contact">
      <h2>We would love your contact info</h2>
      <svg class="swirl" viewBox="0 0 70 96" aria-hidden="true">
        <path class="line" pathLength="1" d="M10 4 C52 2 64 32 36 38 C10 44 14 14 38 24 C60 34 44 62 35 80"/>
        <path class="head" pathLength="1" d="M23 70 L35 88 L48 72"/>
      </svg>
      <a class="contact-btn" href="https://www.postable.com/adiella" target="_blank" rel="noopener">Share your address</a>
    </div>

    <a class="scroll-cue inline" href="#countdown-screen" aria-label="Scroll down">
      <span>Scroll</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </a>
   </div>
  </section>

  <section class="screen" id="countdown-screen">
   <div class="panel">
    <div class="countdown" id="countdown">
      <p class="questions">Please share your address by Nov 10</p>
      <h2>We hope you'll be celebrating with us in</h2>
      <div class="timer">
        <div class="unit"><span class="num" id="days">0</span><span class="label">Days</span></div>
        <div class="unit"><span class="num" id="hours">0</span><span class="label">Hours</span></div>
        <div class="unit"><span class="num" id="minutes">0</span><span class="label">Minutes</span></div>
      </div>
    </div>
   </div>
  </section>
  </div>
  </div>

  <script>
    const target = new Date(2027, 2, 21); // March 21, 2027
    const els = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes')
    };

    function tick() {
      const ms = Math.max(0, target - new Date());
      els.days.textContent = Math.floor(ms / 86400000);
      els.hours.textContent = Math.floor(ms / 3600000) % 24;
      els.minutes.textContent = Math.floor(ms / 60000) % 60;
    }

    tick();
    setInterval(tick, 1000);

    // Keep the framed sections as tall as the save the date card
    const card = document.querySelector('.card');
    new ResizeObserver(() => {
      document.documentElement.style.setProperty('--card-h', card.offsetHeight + 'px');
    }).observe(card);

    // Hide the scroll cue once the guest has started scrolling
    const cue = document.getElementById('scroll-cue');
    window.addEventListener('scroll', () => {
      cue.classList.toggle('hidden', window.scrollY > 40);
    }, { passive: true });

    // Fade the contact and countdown sections in once they scroll into view
    const fadeObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.3 });
    fadeObserver.observe(document.getElementById('follow'));
    fadeObserver.observe(document.getElementById('contact'));
    fadeObserver.observe(document.getElementById('countdown'));
  </script>
</body>
</html>
