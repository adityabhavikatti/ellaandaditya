<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date · Ella & Aditya</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #A49A87;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #1c1819;
      overflow-x: hidden;
    }

    /* Photo booth flash that fades out on load */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 10;
      animation: flash 1s ease-out forwards;
    }

    @keyframes flash {
      0%   { opacity: 0.95; }
      15%  { opacity: 0.95; }
      100% { opacity: 0; }
    }

    /* Each section fills the screen on its own */
    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .scroll-cue {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: #1c1819;
      transition: opacity 0.4s;
    }

    .scroll-cue.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-cue svg {
      width: 22px;
      height: 22px;
      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(6px); }
    }

    .countdown {
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    .countdown.visible {
      opacity: 1;
      transform: none;
    }

    .countdown h2 {
      margin: 0 0 2rem;
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    .timer {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .unit {
      min-width: 6rem;
    }

    .unit .num {
      display: block;
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit .label {
      display: block;
      margin-top: 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .card {
      width: 100%;
      max-width: 1000px;
      background: #f4efe6;
      padding: 2.2rem 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .top, .bottom, .names-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .top { margin-bottom: 1rem; }

    .strips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
    }

    .strip {
      position: relative;
      aspect-ratio: 3 / 5;
      background: #111;
      border: 6px solid #1c1819;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #333;
      opacity: 0;
      filter: blur(6px);
      animation: develop 1.2s ease-out forwards;
    }

    /* Strips 2 and 3 stay in color */
    .strip:nth-child(2) img,
    .strip:nth-child(3) img {
      filter: contrast(1.05) brightness(1);
    }

    /* Each strip develops one after another */
    .strip:nth-child(1) { animation-delay: 1.0s; }
    .strip:nth-child(2) { animation-delay: 1.6s; }
    .strip:nth-child(3) { animation-delay: 2.2s; }
    .strip:nth-child(4) { animation-delay: 2.8s; }

    @keyframes develop {
      0% {
        opacity: 0;
        filter: blur(6px) brightness(1.6);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        filter: blur(0) brightness(1);
      }
    }

    .strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.15) brightness(0.95);
    }

    .names-row {
      margin-top: 1rem;
    }

    .back {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .back a {
      color: #1c1819;
    }

    @media (max-width: 700px) {
      .strips { grid-template-columns: repeat(2, 1fr); }
      .card { padding: 1.5rem; }
      /* Leave room under the card for the fixed scroll cue */
      .screen:first-of-type { padding-bottom: 6rem; }
      .top, .names-row { font-size: 0.7rem; }
      .timer { gap: 0.5rem; }
      .unit { min-width: 4.5rem; }
      .unit .num { font-size: 2.5rem; }
    }

    /* Skip the effects for guests who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      .flash { display: none; }
      .scroll-cue svg { animation: none; }
      .countdown {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .strip {
        opacity: 1;
        filter: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="flash" aria-hidden="true"></div>

  <section class="screen">
  <main class="card">
    <div class="top">
      <span>Save the Date</span>
      <span>[03.21.27]</span>
    </div>

    <div class="strips">
      <div class="strip"><img src="strip1.jpg" alt="Photo booth photo 1"></div>
      <div class="strip"><img src="strip2.jpg" alt="Photo booth photo 2"></div>
      <div class="strip"><img src="strip3.jpg" alt="Photo booth photo 3"></div>
      <div class="strip"><img src="strip4.jpg" alt="Photo booth photo 4"></div>
    </div>

    <div class="names-row">
      <span>Ella and Aditya</span>
      <span>[Portland, OR]</span>
    </div>
  </main>
  </section>

  <a class="scroll-cue" id="scroll-cue" href="#countdown-screen" aria-label="Scroll down">
    <span>Scroll</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </a>

  <section class="screen" id="countdown-screen">
    <div class="countdown" id="countdown">
      <h2>We hope you'll be celebrating with us in</h2>
      <div class="timer">
        <div class="unit"><span class="num" id="days">0</span><span class="label">Days</span></div>
        <div class="unit"><span class="num" id="hours">0</span><span class="label">Hours</span></div>
        <div class="unit"><span class="num" id="minutes">0</span><span class="label">Minutes</span></div>
      </div>
    </div>
  </section>

  <script>
    const target = new Date(2027, 2, 21); // March 21, 2027
    const els = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes')
    };

    function tick() {
      const ms = Math.max(0, target - new Date());
      els.days.textContent = Math.floor(ms / 86400000);
      els.hours.textContent = Math.floor(ms / 3600000) % 24;
      els.minutes.textContent = Math.floor(ms / 60000) % 60;
    }

    tick();
    setInterval(tick, 1000);

    // Hide the scroll cue once the guest has started scrolling
    const cue = document.getElementById('scroll-cue');
    window.addEventListener('scroll', () => {
      cue.classList.toggle('hidden', window.scrollY > 40);
    }, { passive: true });

    // Fade the countdown in once it scrolls into view
    const countdown = document.getElementById('countdown');
    new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.3 }).observe(countdown);
  </script>
</body>
</html>
