<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date · Ella & Aditya</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: #ebe7e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #1c1819;
      overflow-x: hidden;
    }

    /* Photo booth flash that fades out on load */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 10;
      animation: flash 1s ease-out forwards;
    }

    @keyframes flash {
      0%   { opacity: 0.95; }
      15%  { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .card {
      width: 100%;
      max-width: 1000px;
      background: #f4efe6;
      padding: 2.2rem 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .top, .bottom, .names-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .top { margin-bottom: 1rem; }

    .strips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
    }

    .strip {
      position: relative;
      aspect-ratio: 3 / 5;
      background: #111;
      border: 6px solid #1c1819;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #333;
      opacity: 0;
      filter: blur(6px);
      animation: develop 1.2s ease-out forwards;
    }

    /* Strips 2 and 3 stay in color */
    .strip:nth-child(2) img,
    .strip:nth-child(3) img {
      filter: contrast(1.05) brightness(1);
    }

    /* Each strip develops one after another */
    .strip:nth-child(1) { animation-delay: 1.0s; }
    .strip:nth-child(2) { animation-delay: 1.6s; }
    .strip:nth-child(3) { animation-delay: 2.2s; }
    .strip:nth-child(4) { animation-delay: 2.8s; }

    @keyframes develop {
      0% {
        opacity: 0;
        filter: blur(6px) brightness(1.6);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        filter: blur(0) brightness(1);
      }
    }

    .strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.15) brightness(0.95);
    }

    .names-row {
      margin-top: 1rem;
    }

    .back {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .back a {
      color: #1c1819;
    }

    @media (max-width: 700px) {
      .strips { grid-template-columns: repeat(2, 1fr); }
      .card { padding: 1.5rem; }
      .top, .names-row { font-size: 0.7rem; }
    }

    /* Skip the effects for guests who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      .flash { display: none; }
      .strip {
        opacity: 1;
        filter: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="flash" aria-hidden="true"></div>

  <main class="card">
    <div class="top">
      <span>Save the Date</span>
      <span>[03.21.27]</span>
    </div>

    <div class="strips">
      <div class="strip"><img src="strip1.jpg" alt="Photo booth photo 1"></div>
      <div class="strip"><img src="strip2.jpg" alt="Photo booth photo 2"></div>
      <div class="strip"><img src="strip3.jpg" alt="Photo booth photo 3"></div>
      <div class="strip"><img src="strip4.jpg" alt="Photo booth photo 4"></div>
    </div>

    <div class="names-row">
      <span>Ella and Aditya</span>
      <span>[Portland, OR]</span>
    </div>
  </main>

</body>
</html>
